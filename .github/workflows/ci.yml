name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair_lockfile:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/release-gates-dependabot-leads-20261116' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Patch and validate lockfile before push
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          npm pkg set \
            'dependencies.next=16.4.6' \
            'dependencies.sharp=0.35.5' \
            'devDependencies.eslint-config-next=^16.4.6' \
            'devDependencies.@next/eslint-plugin-next=^16.4.6' \
            'overrides.sharp=0.35.5' \
            'overrides.postcss=8.5.33' \
            'overrides.nanoid=3.3.20' \
            'overrides.source-map-js=1.2.2' \
            'overrides.js-yaml=4.3.2'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --no-fund
          npm ci --include=optional --no-fund
          npm test
          npm run lint
          npm run typecheck
          npm run build
          node scripts/audit-dependencies.mjs --omit-dev
          node scripts/audit-dependencies.mjs
          git add -- package.json package-lock.json
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): tested security patches with full npm lockfile"
          basic_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic_auth" push origin "HEAD:refs/heads/fix/release-gates-dependabot-leads-20261116"
  verify:
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'fix/release-gates-dependabot-leads-20261116' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install reproducibly
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: npm ci --include=optional --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Regression tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Production route smoke tests
        shell: bash
        run: |
          npm run start -- -p 3100 > /tmp/hocker-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          BASE_URL=http://127.0.0.1:3100 node scripts/smoke-production.mjs

      - name: Production dependency audit
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: node scripts/audit-dependencies.mjs --omit-dev

      - name: Full dependency audit
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: node scripts/audit-dependencies.mjs
