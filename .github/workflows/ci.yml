name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - fix/full-hardening-20260730

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install reproducibly
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: npm ci --include=optional --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Regression tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Production route smoke tests
        shell: bash
        run: |
          npm run start -- -p 3100 > /tmp/hocker-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          BASE_URL=http://127.0.0.1:3100 node scripts/smoke-production.mjs

      - name: Production dependency audit
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: node scripts/audit-dependencies.mjs --omit-dev

      - name: Full dependency audit
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: node scripts/audit-dependencies.mjs
