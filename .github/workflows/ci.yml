name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair_verified_lockfile:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/transparent-brand-logo-20261117' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout exact PR SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Generate complete reproducible lockfile and validate before pushing
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --fetch-retries=2
          npm ci --include=optional --no-fund --fetch-retries=2
          npm test
          npm run lint
          npm run typecheck
          npm run build
          npm run start -- -p 3100 >/tmp/hocker-verified-brand.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          BASE_URL=http://127.0.0.1:3100 node scripts/smoke-production.mjs
          node scripts/audit-dependencies.mjs --omit-dev
          node scripts/audit-dependencies.mjs
          git show "HEAD^:.github/workflows/ci.yml" > .github/workflows/ci.yml
          git checkout -- next-env.d.ts || true
          rm -f tsconfig.tsbuildinfo
          git add -- package-lock.json .github/workflows/ci.yml
          git diff --cached --check
          git diff --cached --quiet && { echo "Missing locked changes"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): replace vulnerable ESLint chain with audited Oxlint"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/fix/transparent-brand-logo-20261117"
  verify:
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'fix/transparent-brand-logo-20261117' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install reproducibly
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: npm ci --include=optional --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Regression tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Production route smoke tests
        shell: bash
        run: |
          npm run start -- -p 3100 > /tmp/hocker-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          BASE_URL=http://127.0.0.1:3100 node scripts/smoke-production.mjs

      - name: Production dependency audit
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: node scripts/audit-dependencies.mjs --omit-dev

      - name: Full dependency audit
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: node scripts/audit-dependencies.mjs
