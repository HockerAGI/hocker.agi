name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - fix/full-hardening-20260730

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install reproducibly
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: npm ci --include=optional --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Regression tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Production dependency audit
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: npm audit --omit=dev --audit-level=high
