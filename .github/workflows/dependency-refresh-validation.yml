name: Dependency Refresh Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dependency-refresh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Generate refreshed dependency graph
        run: |
          npm install --save-exact react@19.2.8 react-dom@19.2.8
          npm install --save-dev --save-exact postcss@8.5.23
          npm pkg set 'overrides.postcss=$postcss'
          npm install --package-lock-only
          npm ci --include=optional
          npm dedupe

      - name: Verify installed versions
        run: |
          npm ls next react react-dom sharp postcss --depth=0
          npm ls next react react-dom sharp postcss --depth=0 > dependency-report.txt

      - name: Regression tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Upload validated dependency files
        uses: actions/upload-artifact@v5
        with:
          name: dependency-refresh
          path: |
            package.json
            package-lock.json
            dependency-report.txt
          if-no-files-found: error
          retention-days: 1
