name: Dependency Refresh Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: dependency-refresh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Generate refreshed dependency graph
        run: |
          npm pkg delete devDependencies.postcss
          npm pkg set overrides.postcss=8.5.23
          npm install --save-exact react@19.2.8 react-dom@19.2.8
          npm install --package-lock-only
          npm ci --include=optional
          npm dedupe
          sed -i 's/19\.2\.7/19.2.8/g' tests/hardening.test.mjs

      - name: Verify installed versions
        run: |
          npm ls next react react-dom sharp postcss
          npm ls next react react-dom sharp postcss > dependency-report.txt

      - name: Regression tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Upload validated dependency files
        uses: actions/upload-artifact@v5
        with:
          name: dependency-refresh
          path: |
            package.json
            package-lock.json
            tests/hardening.test.mjs
            dependency-report.txt
          if-no-files-found: error
          retention-days: 1

      - name: Publish validated files to update branch
        env:
          TARGET_BRANCH: chore/dependency-refresh-20260804
        run: |
          mkdir -p /tmp/dependency-refresh/tests
          cp package.json package-lock.json /tmp/dependency-refresh/
          cp tests/hardening.test.mjs /tmp/dependency-refresh/tests/
          git fetch origin main
          git switch --force-create "$TARGET_BRANCH" origin/main
          cp /tmp/dependency-refresh/package.json package.json
          cp /tmp/dependency-refresh/package-lock.json package-lock.json
          cp /tmp/dependency-refresh/tests/hardening.test.mjs tests/hardening.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json tests/hardening.test.mjs
          git commit -m "chore: refresh React and PostCSS dependencies"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
