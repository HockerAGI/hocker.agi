name: Restore original product logos

on:
  push:
    branches:
      - fix/restore-original-logos-20260805
    paths:
      - .github/workflows/restore-original-logos.yml

permissions:
  contents: write

concurrency:
  group: restore-original-product-logos
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: fix/restore-original-logos-20260805

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore original uploaded artwork from repository history
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT=6a8be0c407cc0c9fdd5ab240c3bb12ccf990161c
          products=(
            hocker-one
            hocker-hub
            hocker-drive-cloud
            chido-casino
            trackhok
            nexpa
            hocker-up
            hocker-supply
          )

          for product in "${products[@]}"; do
            git checkout "$SOURCE_COMMIT" -- \
              "public/apps/$product/logo.png" \
              "public/apps/$product/cover.png"
          done

      - name: Create faithful technical derivatives
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import sharp from 'sharp';

          const products = [
            'hocker-one',
            'hocker-hub',
            'hocker-drive-cloud',
            'chido-casino',
            'trackhok',
            'nexpa',
            'hocker-up',
            'hocker-supply',
          ];

          async function backgroundFor(file) {
            const image = sharp(file);
            const metadata = await image.metadata();
            const { dominant } = await image.stats();
            return {
              r: dominant.r,
              g: dominant.g,
              b: dominant.b,
              alpha: 1,
            };
          }

          async function render(input, output, width, height, format, margin = 0) {
            const background = await backgroundFor(input);
            const targetWidth = width - margin * 2;
            const targetHeight = height - margin * 2;

            let pipeline = sharp(input)
              .rotate()
              .resize(targetWidth, targetHeight, {
                fit: 'contain',
                position: 'centre',
                background,
                withoutEnlargement: false,
              })
              .extend({
                top: margin,
                bottom: margin,
                left: margin,
                right: margin,
                background,
              });

            if (format === 'webp') {
              pipeline = pipeline.webp({ quality: 90, effort: 6 });
            } else {
              pipeline = pipeline.png({ compressionLevel: 9, adaptiveFiltering: true });
            }

            await pipeline.toFile(output);
          }

          for (const product of products) {
            const directory = path.join('public', 'apps', product);
            const logo = path.join(directory, 'logo.png');
            const cover = path.join(directory, 'cover.png');

            await render(logo, path.join(directory, 'icon.png'), 512, 512, 'png');
            await render(logo, path.join(directory, 'icon-maskable.png'), 512, 512, 'png', 52);
            await render(logo, path.join(directory, 'logo-stacked.png'), 1200, 1200, 'png', 24);
            await render(logo, path.join(directory, 'logo-horizontal.png'), 1600, 600, 'png', 30);
            await render(cover, path.join(directory, 'cover.webp'), 1600, 900, 'webp', 24);
            await render(cover, path.join(directory, 'og-image.webp'), 1200, 630, 'webp', 24);

            await fs.rm(path.join(directory, 'icon.svg'), { force: true });
            await fs.rm(logo, { force: true });
            await fs.rm(cover, { force: true });
          }

          await fs.rm('.brand-source-originals', { recursive: true, force: true });
          NODE

      - name: Validate project
        shell: bash
        run: |
          npm test
          npm run lint
          npm run typecheck
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Commit restored originals
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/apps .brand-source-originals
          git rm --cached --ignore-unmatch .github/workflows/restore-original-logos.yml
          rm -f .github/workflows/restore-original-logos.yml
          git add -u .github/workflows/restore-original-logos.yml

          if git diff --cached --quiet; then
            echo "No asset changes detected."
            exit 0
          fi

          git commit -m "fix(brand): restore exact original product logos [skip vercel]"
          git push origin HEAD:fix/restore-original-logos-20260805
