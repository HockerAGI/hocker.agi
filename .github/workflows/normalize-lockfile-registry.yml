name: Normalize lockfile registry

on:
  push:
    branches:
      - fix/full-hardening-20260730

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-hardening-20260730
      - name: Replace environment-specific registry URLs
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'package-lock.json';
          const internal = 'https://packages.applied-caas-gateway1.internal.api.openai.org/artifactory/api/npm/npm-public/';
          const official = 'https://registry.npmjs.org/';
          const before = fs.readFileSync(path, 'utf8');
          const occurrences = before.split(internal).length - 1;
          if (occurrences === 0) {
            console.log('Lockfile already portable.');
            process.exit(0);
          }
          const after = before.split(internal).join(official);
          fs.writeFileSync(path, after);
          console.log(`Normalized ${occurrences} registry URL(s).`);
          NODE
      - name: Commit normalized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): normalize package lock registry URLs"
          git push
