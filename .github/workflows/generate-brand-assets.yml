name: Generate brand assets

on:
  workflow_dispatch:
  push:
    branches:
      - fix/brand-assets-mobile-20260804
    paths:
      - scripts/generate-brand-assets.mjs
      - scripts/generate-site-icons.mjs
      - .github/workflows/generate-brand-assets.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/brand-assets-mobile-20260804
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate normalized assets
        run: |
          node scripts/generate-brand-assets.mjs
          node scripts/generate-site-icons.mjs

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/apps public/brand public/icon.png public/apple-icon.png public/og-image.png
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore(brand): generate normalized product and site assets [skip ci] [skip vercel]"
          git push origin HEAD:fix/brand-assets-mobile-20260804
