name: Temporary verified brand asset integration
on:
  push:
    branches:
      - fix/transparent-brand-logo-20261117
permissions:
  contents: read
jobs:
  generate:
    if: >-
      github.repository == 'HockerAGI/hocker.agi' &&
      github.ref == 'refs/heads/fix/transparent-brand-logo-20261117' &&
      github.event.head_commit.message != 'chore(brand): generated approved technical assets'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: write
    steps:
      - name: Checkout exact branch SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Generate only from owner-approved PNG originals and validate
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-fund
          node scripts/generate-brand-assets.mjs
          npm test
          npm run lint
          npm run typecheck
          npm run build
          node scripts/audit-dependencies.mjs --omit-dev
          npm run start -- -p 3100 >/tmp/hocker-brand-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          BASE_URL=http://127.0.0.1:3100 node scripts/smoke-production.mjs
      - name: Commit only generated binary assets to isolated branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- public/icon.png public/apple-icon.png public/favicon.ico public/og-image.png public/brand/hocker-agi-official-lockup.jpg public/brand/logo.png
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(brand): generated approved technical assets"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/fix/transparent-brand-logo-20261117"
