name: Remove unused PHASES import

on:
  push:
    branches:
      - fix/full-hardening-20260730

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-hardening-20260730
      - name: Remove unused import
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'src/app/page.tsx';
          const before = fs.readFileSync(path, 'utf8');
          const after = before.replace(
            'import { APPS, PHASES, PORTFOLIO, SERVICES, SITE } from "@/lib/site-data";',
            'import { APPS, PORTFOLIO, SERVICES, SITE } from "@/lib/site-data";',
          );
          if (before === after) {
            throw new Error('Expected PHASES import was not found');
          }
          fs.writeFileSync(path, after);
          NODE
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "fix(lint): remove unused PHASES import"
          git push
