version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Tijuana
    open-pull-requests-limit: 2
    groups:
      next-stack:
        applies-to: version-updates
        patterns:
          - "next"
        update-types:
          - minor
          - patch
      other-compatible:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "next"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Tijuana
    open-pull-requests-limit: 1
    groups:
      compatible-actions:
        applies-to: version-updates
        patterns:
          - "actions/*"
        update-types:
          - minor
          - patch
